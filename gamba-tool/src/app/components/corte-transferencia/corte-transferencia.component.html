<div class="row">
    <div class="col-12">
        <form [formGroup]="formCorteTransf" (ngSubmit)="onSubmit()">
            <div class="form-group row">
                <label for="" class="col-sm-4 col-form-label">Tipo de Operacion</label>
                <div class="col-sm-8">
                    <select class="form-control" id="" formControlName="seleccion" required>
                        <option value="CODIGO" selected>CODIGO</option>
                        <option value="BOLETA">BOLETA</option>
                        <option value="POS">POS</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label for="" class="col-sm-4 col-form-label">Ingrese el num de
                    {{formCorteTransf.get("seleccion")?.value}}</label>
                <div class="col-sm-8">
                    <input type="number" class="form-control" id="" formControlName="numOp" min="0" required>
                </div>
            </div>
            <div class="form-group row">
                <label for="" class="col-sm-4 col-form-label">Ingrese el Monto</label>
                <div class="col-sm-8">
                    <input type="number" class="form-control" id="" formControlName="monto" step="10" min="10">
                </div>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-block btn-lg btn-success">Agregar</button>
            </div>
        </form>
    </div>
    <div class="col-12">
        <h4>Texto para las Transferencias <span><button type="button" class="btn btn-sm btn-ligth float-right"
                    (click)="toCopy()">Copiar</button></span></h4>
        <textarea class="form-control" rows="3" readonly [(ngModel)]="textoParaCopiar"></textarea>
        <br>
        <p>Cortes total ${{totalTransfer}}</p>
        <div class="table-responsive">
            <table class="table table-bordered text-center">
                <thead class="thead-dark">
                    <tr>
                        <th *ngFor="let x of cortes.reverse()">{{x}}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td *ngFor="let y of totalCortes">{{y}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
